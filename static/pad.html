<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pad</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="pad-body">

<div class="overlay" id="auth-overlay" style="display:none">
  <div class="auth-dialog">
    <h2>Enter password</h2>
    <p class="auth-desc">This pad requires a password to access.</p>
    <form id="auth-form">
      <input type="password" id="auth-password" placeholder="password" autocomplete="off" autofocus>
      <button type="submit" class="btn">Open</button>
    </form>
    <p class="auth-error" id="auth-error"></p>
  </div>
</div>

<div class="editor-wrap" id="editor-wrap" style="display:none">
  <div class="toolbar">
    <a href="/" class="toolbar-brand">Pad</a>
    <span class="toolbar-name" id="pad-name"></span>
    <span class="toolbar-lock" id="lock-icon" title="Encrypted"></span>
    <span class="toolbar-spacer"></span>
    <span class="toolbar-info" id="line-info">Ln 1, Col 1</span>
    <span class="toolbar-status" id="status">opening</span>
    <span class="toolbar-clients">all browsers can edit</span>
  </div>
  <div class="editor">
    <div class="gutter" id="gutter" aria-hidden="true"></div>
    <textarea id="text" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" disabled></textarea>
  </div>
</div>

<script>
(function() {
  const padName = window.location.pathname.replace(/^\/+/, '');
  if (!padName || padName === 'index.html' || padName.startsWith('static/')) {
    window.location.href = '/';
    return;
  }

  const subtle = window.crypto.subtle;
  const textarea = document.getElementById('text');
  const gutter = document.getElementById('gutter');
  const statusEl = document.getElementById('status');
  const lineInfoEl = document.getElementById('line-info');
  const authOverlay = document.getElementById('auth-overlay');
  const editorWrap = document.getElementById('editor-wrap');
  const authError = document.getElementById('auth-error');
  const lockIcon = document.getElementById('lock-icon');

  let password = '';
  let wantsCreate = false;
  let authHash = '';
  let aesKey = null;
  let encrypted = false;
  let version = 0;
  let dirty = false;
  let saving = false;
  let saveTimer = null;
  let retryTimer = null;
  let pollTimer = null;
  let opened = false;

  document.getElementById('pad-name').textContent = padName;
  document.title = padName + ' \u2014 Pad';

  function bytesToHex(bytes) {
    return Array.from(bytes, function(byte) {
      return byte.toString(16).padStart(2, '0');
    }).join('');
  }

  function hexToBytes(hex) {
    const bytes = new Uint8Array(hex.length / 2);
    for (let index = 0; index < hex.length; index += 2) {
      bytes[index / 2] = parseInt(hex.slice(index, index + 2), 16);
    }
    return bytes;
  }

  function randomHex(length) {
    return bytesToHex(crypto.getRandomValues(new Uint8Array(length)));
  }

  async function deriveKey(rawPassword, salt) {
    const material = await subtle.importKey(
      'raw', new TextEncoder().encode(rawPassword), 'PBKDF2', false, ['deriveKey']
    );
    return subtle.deriveKey(
      { name: 'PBKDF2', salt: hexToBytes(salt), iterations: 600000, hash: 'SHA-256' },
      material,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function deriveAuthHash(rawPassword, salt) {
    const material = await subtle.importKey(
      'raw', new TextEncoder().encode(rawPassword), 'PBKDF2', false, ['deriveBits']
    );
    const bits = await subtle.deriveBits(
      { name: 'PBKDF2', salt: hexToBytes(salt), iterations: 600000, hash: 'SHA-256' },
      material,
      256
    );
    return bytesToHex(new Uint8Array(bits));
  }

  async function encryptText(text) {
    if (!encrypted) return text;
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertext = await subtle.encrypt(
      { name: 'AES-GCM', iv: iv }, aesKey, new TextEncoder().encode(text)
    );
    const combined = new Uint8Array(iv.length + ciphertext.byteLength);
    combined.set(iv);
    combined.set(new Uint8Array(ciphertext), iv.length);
    return btoa(String.fromCharCode.apply(null, combined));
  }

  async function decryptText(text) {
    if (!encrypted || !text) return text || '';
    try {
      const raw = Uint8Array.from(atob(text), function(char) { return char.charCodeAt(0); });
      const plaintext = await subtle.decrypt(
        { name: 'AES-GCM', iv: raw.slice(0, 12) }, aesKey, raw.slice(12)
      );
      return new TextDecoder().decode(plaintext);
    } catch (error) {
      throw new Error('Unable to decrypt this pad');
    }
  }

  function apiHeaders(includeJson) {
    const headers = {};
    if (includeJson) headers['Content-Type'] = 'application/json';
    if (authHash) headers['X-Pad-Auth'] = authHash;
    return headers;
  }

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = 'toolbar-status status-' + type;
  }

  function showEditor() {
    authOverlay.style.display = 'none';
    editorWrap.style.display = '';
    textarea.disabled = false;
    opened = true;
    resizeEditor();
    updateGutter();
    updateLineInfo();
    textarea.focus();
  }

  function showAuth(message) {
    editorWrap.style.display = 'none';
    authOverlay.style.display = '';
    authError.textContent = message || '';
    const input = document.getElementById('auth-password');
    input.value = '';
    input.focus();
  }

  function resizeEditor() {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }

  function updateGutter() {
    const count = textarea.value.split('\n').length;
    let html = '';
    for (let line = 1; line <= count; line++) {
      html += '<div class="gutter-line">' + line + '</div>';
    }
    gutter.innerHTML = html;
  }

  function updateLineInfo() {
    const before = textarea.value.slice(0, textarea.selectionStart);
    const line = before.split('\n').length;
    const column = textarea.selectionStart - before.lastIndexOf('\n');
    const total = textarea.value.split('\n').length;
    lineInfoEl.textContent = 'Ln ' + line + '/' + total + ', Col ' + column;
  }

  function applyRemoteText(text) {
    const position = textarea.selectionStart;
    const scrollY = window.scrollY;
    textarea.value = text;
    resizeEditor();
    updateGutter();
    textarea.selectionStart = textarea.selectionEnd = Math.min(position, text.length);
    updateLineInfo();
    window.scrollTo(0, scrollY);
  }

  async function fetchDocument(since) {
    const suffix = since === undefined ? '' : '?since=' + encodeURIComponent(since);
    return fetch('/api/pads/' + encodeURIComponent(padName) + suffix, {
      headers: apiHeaders(false),
      cache: 'no-store'
    });
  }

  async function poll() {
    if (!opened || dirty || saving) return;
    try {
      const response = await fetchDocument(version);
      if (response.status === 204) return;
      if (!response.ok) throw new Error('update check failed');
      const data = await response.json();
      const remoteText = await decryptText(data.text);
      version = data.version;
      if (remoteText !== textarea.value) applyRemoteText(remoteText);
      setStatus('saved', 'ok');
    } catch (error) {
      setStatus('offline; retrying', 'warn');
    }
  }

  async function save() {
    clearTimeout(retryTimer);
    if (!opened || !dirty || saving) return;
    saving = true;
    const snapshot = textarea.value;
    const baseVersion = version;
    setStatus('saving', 'warn');
    try {
      const response = await fetch('/api/pads/' + encodeURIComponent(padName), {
        method: 'PUT',
        headers: apiHeaders(true),
        body: JSON.stringify({
          text: await encryptText(snapshot),
          version: baseVersion
        })
      });
      if (response.status === 409) {
        const latest = await response.json();
        version = latest.version;
        dirty = true;
        saving = false;
        setStatus('changed elsewhere; type again to save yours', 'warn');
        return;
      }
      if (!response.ok) throw new Error('save failed');
      const result = await response.json();
      version = result.version;
      dirty = textarea.value !== snapshot;
      saving = false;
      setStatus(dirty ? 'unsaved' : 'saved', dirty ? 'warn' : 'ok');
      if (dirty) scheduleSave(50);
    } catch (error) {
      saving = false;
      dirty = true;
      setStatus('offline; save retrying', 'warn');
      retryTimer = setTimeout(save, 1500);
    }
  }

  function scheduleSave(delay) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, delay === undefined ? 250 : delay);
  }

  async function createPad(meta) {
    encrypted = password.length > 0;
    let authSalt = '';
    let encSalt = '';
    if (encrypted) {
      authSalt = randomHex(16);
      encSalt = randomHex(16);
      authHash = await deriveAuthHash(password, authSalt);
      aesKey = await deriveKey(password, encSalt);
      lockIcon.textContent = '\u{1F512}';
    }
    const response = await fetch('/api/pads/' + encodeURIComponent(padName), {
      method: 'PUT',
      headers: apiHeaders(true),
      body: JSON.stringify({
        create: true,
        encrypted: encrypted,
        auth_salt: authSalt,
        auth_hash: authHash,
        enc_salt: encSalt,
        text: await encryptText(''),
        version: 0
      })
    });
    if (!response.ok) throw new Error('Unable to create pad');
    version = (await response.json()).version;
    applyRemoteText('');
    showEditor();
    setStatus('saved', 'ok');
  }

  async function openPad(meta) {
    encrypted = meta.encrypted;
    if (encrypted) {
      if (!password) {
        showAuth('');
        return;
      }
      authHash = await deriveAuthHash(password, meta.auth_salt);
      aesKey = await deriveKey(password, meta.enc_salt);
      lockIcon.textContent = '\u{1F512}';
    }
    const response = await fetchDocument();
    if (response.status === 403) {
      authHash = '';
      aesKey = null;
      showAuth('Authentication failed.');
      return;
    }
    if (!response.ok) throw new Error('Unable to open pad');
    const data = await response.json();
    applyRemoteText(await decryptText(data.text));
    version = data.version;
    dirty = false;
    showEditor();
    setStatus('saved', 'ok');
  }

  async function initialize() {
    try {
      setStatus('opening', 'warn');
      const response = await fetch('/api/pads/' + encodeURIComponent(padName) + '/meta', {
        cache: 'no-store'
      });
      if (!response.ok) throw new Error('Unable to read pad metadata');
      const meta = await response.json();
      if (!meta.exists) {
        if (!wantsCreate) {
          showAuth('Pad does not exist. Create it from the home page.');
          return;
        }
        await createPad(meta);
      } else {
        await openPad(meta);
      }
      if (!pollTimer) pollTimer = setInterval(poll, 500);
    } catch (error) {
      setStatus(error.message || 'Unable to open pad', 'err');
      if (!opened) showAuth(error.message || 'Unable to open pad');
    }
  }

  document.getElementById('auth-form').addEventListener('submit', function(event) {
    event.preventDefault();
    password = document.getElementById('auth-password').value;
    authError.textContent = '';
    initialize();
  });

  textarea.addEventListener('input', function() {
    dirty = true;
    resizeEditor();
    updateGutter();
    updateLineInfo();
    setStatus('unsaved', 'warn');
    scheduleSave();
  });
  textarea.addEventListener('click', updateLineInfo);
  textarea.addEventListener('keyup', updateLineInfo);
  textarea.addEventListener('keydown', function(event) {
    if (event.key !== 'Tab') return;
    event.preventDefault();
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    textarea.value = textarea.value.slice(0, start) + '  ' + textarea.value.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + 2;
    textarea.dispatchEvent(new Event('input', { bubbles: true }));
  });

  let resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      resizeEditor();
      updateGutter();
    }, 100);
  });

  const storedFor = sessionStorage.getItem('pad_password_for');
  const storedPassword = sessionStorage.getItem('pad_password');
  if (storedFor === padName && storedPassword !== null) {
    password = storedPassword;
    wantsCreate = sessionStorage.getItem('pad_create') === '1';
    sessionStorage.removeItem('pad_password');
    sessionStorage.removeItem('pad_password_for');
    sessionStorage.removeItem('pad_create');
  }
  initialize();
})();
</script>
</body>
</html>
